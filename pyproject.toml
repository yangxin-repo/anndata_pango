[project]
name = "anndata_pango"
version = "0.1.0"
description = "the extension of anndata"
readme = "README.md"
authors = [
    { name = "Yangxin Zhang", email = "yangxin_0624@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anndata",
    "csbdeep",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "Pillow==13.0.0",
    "platformdirs==4.13.5",
    "playwright==1.64.0",
    "Requests==2.34.2",
    "scanpy==1.12.4",
    "scipy==1.18.1",
    "stardist==0.9.2",
    "tqdm==4.70.1",
    "scvi-tools"
]

[project.scripts]
anndata-pango = "anndata_pango:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
