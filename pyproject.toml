[project]
name = "anndata_pango"
version = "0.1.0"
description = "the extension of anndata"
readme = "README.md"
authors = [
    { name = "Yangxin Zhang", email = "yangxin_0624@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [

    "anndata",
    "scanpy",
    "spatialleiden",
    "squidpy",
    "pyensembl",
    #"cell_type_mapper @ git+https://github.com/AllenInstitute/cell_type_mapper.git",

    "numpy",
    "pandas",
    "scipy",

    "Pillow",
    "opencv-python",
    "scikit-image",

    "tensorflow[and-cuda]",
    "torch",
    "stardist",
    "scvi-tools",
    "h5py",

    "requests",
    "playwright"
]

[project.scripts]
anndata-pango = "anndata_pango:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
