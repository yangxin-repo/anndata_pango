[project]
name = "anndata_pango"
version = "0.1.0"
description = "the extension of anndata"
readme = "README.md"
authors = [
    { name = "Yangxin Zhang", email = "yangxin_0624@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anndata",
    "numpy",
    "pandas",
    "Pillow",
    "scanpy",
    "scipy",
    "stardist",
    "scvi-tools",
    "h5py",
    "requests",
    "playwright",
    "skimage",
    "spatialleiden",
    "squidpy",
    "uuid",
    "cell_type_mapper",
    "tempfile",
    "shutil"
]

[project.scripts]
anndata-pango = "anndata_pango:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
